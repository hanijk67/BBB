<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  LMS (T4): جایگزینی فونت‌های رایج اسلایدهای ایرانی با Vazirmatn (OFL) هنگام تبدیل اسلاید در
  LibreOffice (کانتینر bbb-soffice که /etc/fonts و /usr/share/fonts را read-only از host mount
  می‌کند — bbb-libreoffice/assets/convert-local.sh). فونت‌های غیرآزاد روی سرور نصب نمی‌شوند.
  نصب: apply-config.sh → /etc/fonts/conf.d/99-lms-fa.conf + fc-cache -f
-->
<fontconfig>
  <alias binding="same"><family>B Nazanin</family><prefer><family>Vazirmatn</family></prefer></alias>
  <alias binding="same"><family>B Titr</family><prefer><family>Vazirmatn</family></prefer></alias>
  <alias binding="same"><family>B Mitra</family><prefer><family>Vazirmatn</family></prefer></alias>
  <alias binding="same"><family>B Lotus</family><prefer><family>Vazirmatn</family></prefer></alias>
  <alias binding="same"><family>B Yekan</family><prefer><family>Vazirmatn</family></prefer></alias>
  <alias binding="same"><family>B Zar</family><prefer><family>Vazirmatn</family></prefer></alias>
  <alias binding="same"><family>IRANSans</family><prefer><family>Vazirmatn</family></prefer></alias>
  <alias binding="same"><family>IRANSansWeb</family><prefer><family>Vazirmatn</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>Vazirmatn</family></prefer></alias>

  <!-- B Titr معمولاً فقط ضخیم استفاده می‌شود -->
  <match target="pattern">
    <test name="family" qual="any"><string>B Titr</string></test>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>

  <!-- متن فارسی بدون فونت مشخص هم با Vazirmatn رندر شود -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>fa</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Vazirmatn</string></edit>
  </match>
</fontconfig>
